[project]
name = "roast-bench"
version = "0.0.1"
description = "Roast-generation benchmark: preflight pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# external_pairs.py downloads the public humour-preference sets; nothing else needs these
anchor = ["huggingface_hub>=0.25", "pandas>=2.0", "pyarrow>=15"]

[tool.uv]
package = false
