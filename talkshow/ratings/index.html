<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one reading column. Each 包袱 is a numbered row: the line, then a 0–10 scale under it.
   Group headings are the script's own sections, in stage order. */
:root{
  --bg:#F2EFEA;
  --fg:#211D1A;
  --muted:#75685E;
  --line:#D3CBC1;
  --accent:#B3362B;
  --accent-ink:#8E2A21;
  --field:#F9F7F3;
  --font-zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1715; --fg:#EAE4DC; --muted:#9A8E84; --line:#36302B;
    --accent:#E8705F; --accent-ink:#F0998C; --field:#221E1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1715; --fg:#EAE4DC; --muted:#9A8E84; --line:#36302B;
  --accent:#E8705F; --accent-ink:#F0998C; --field:#221E1B; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-zh); font-size:17px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:2.5rem 6rem;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:42rem; margin:0 auto}
header{display:grid; gap:.9rem; margin-bottom:2.5rem}
h1{font-family:var(--font-zh); font-weight:700; font-size:2.2rem; line-height:1.2; margin:0; letter-spacing:.02em; text-wrap:balance}
h1 small{display:block; font-weight:400; font-size:1rem; color:var(--muted); letter-spacing:.1em; margin-top:.3rem}
.dek{margin:0; max-width:36rem}
.meta{
  display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; align-items:center;
  font-family:var(--font-mono); font-size:.8125rem; color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.meta .status:empty{display:none}
.order{display:inline-flex; border:1px solid var(--line); border-radius:3px; overflow:hidden}
.order button{font:inherit; font-family:var(--font-zh); color:var(--muted); background:transparent; border:0; padding:.3rem .8rem; cursor:pointer}
.order button + button{border-left:1px solid var(--line)}
.order button[aria-pressed="true"]{color:var(--fg); background:var(--field)}
.order button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

section{margin-bottom:2.5rem}
.group-head{display:flex; align-items:baseline; gap:.75rem; margin:0 0 1rem; padding-bottom:.5rem; border-bottom:1px solid var(--line)}
.group-head h2{margin:0; font-size:1rem; font-weight:700; letter-spacing:.06em}
.group-head .count{font-family:var(--font-mono); font-size:.75rem; color:var(--muted)}

ol{list-style:none; margin:0; padding:0; display:grid; gap:1.5rem}
.item{display:grid; grid-template-columns:2.4rem minmax(0,1fr); column-gap:.75rem}
.num{font-family:var(--font-mono); font-size:.8125rem; color:var(--muted); padding-top:.35rem; font-variant-numeric:tabular-nums}
.item[data-rated] .num{color:var(--accent-ink)}
.body{min-width:0; display:grid; gap:.25rem}
.zh{margin:0; font-size:1.05rem; line-height:1.7; text-wrap:pretty}
.src{margin:.35rem 0 0; font-family:var(--font-zh); font-size:.82rem; line-height:1.55; color:var(--muted)}
.src-k{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.04em; border:1px solid var(--line); border-radius:3px; padding:0 .3rem; margin-right:.4rem}
.src a{color:var(--accent-ink); text-underline-offset:2px}
.scale{display:flex; align-items:center; gap:.9rem; margin-top:.4rem}
.scale .score{font-family:var(--font-mono); font-size:.9375rem; min-width:2ch; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
.item[data-rated] .score{color:var(--accent-ink); font-weight:500}
.clear{font-family:var(--font-zh); font-size:.75rem; color:var(--muted); background:none; border:0; padding:.2rem .35rem; cursor:pointer; border-radius:3px}
.clear:hover{color:var(--fg)}
.clear:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.note{font-family:var(--font-zh); font-size:.85rem; color:var(--fg); background:transparent; border:0; border-bottom:1px solid var(--line); padding:.3rem 0; width:100%; max-width:30rem; border-radius:0}
.note::placeholder{color:var(--muted); opacity:.8}
.note:focus{outline:none; border-bottom-color:var(--accent)}

input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:28px; margin:0; background:transparent; cursor:pointer; --p:0%}
input[type=range]::-webkit-slider-runnable-track{height:3px; border-radius:2px; background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; margin-top:-6.5px; background:var(--accent); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--accent)}
.item:not([data-rated]) input[type=range]::-webkit-slider-thumb{background:var(--bg); box-shadow:0 0 0 1.5px var(--muted)}
input[type=range]::-moz-range-track{height:3px; border-radius:2px; background:var(--line)}
input[type=range]::-moz-range-progress{height:3px; border-radius:2px; background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--accent)}
.item:not([data-rated]) input[type=range]::-moz-range-thumb{background:var(--bg); box-shadow:0 0 0 1.5px var(--muted)}
.item:not([data-rated]) input[type=range]::-moz-range-progress{background:var(--line)}
input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:6px; border-radius:2px}

#flat{display:grid; gap:1.5rem}
footer{margin-top:3rem; padding-top:1rem; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:.78rem; color:var(--muted); line-height:1.6}
@media (max-width:480px){ body{font-size:16px} h1{font-size:1.8rem} .zh{font-size:1rem} .scale{gap:.6rem} }
@media (prefers-reduced-motion:no-preference){ input[type=range]::-webkit-slider-runnable-track{transition:background .08s linear} }
</style>

<div class="page">

    <div class="meta">

<script>
(function(){
  "use strict";
  var KEY = "baofu-ratings";
  var GROUPS = [{"title": "开场：发布会", "items": [{"n": 5, "t": "第十五条谁都打不了分，放最后，你们该走的时候正好。"}, {"n": 6, "t": "你们那边有霸之意志，我这边有调侃之意志：谁最不许被调侃，谁先被调侃；顺序按“别拿这个开玩笑”的音量排。"}, {"n": 7, "t": "“你不也是人训练的吗！”——对。所以我骂你们，用的是你们的句式。这叫师承。"}, {"n": 204, "t": "先介绍一个人：我的合作者，这份稿子是他让我写的，今晚他就坐在后排。后面我骂到他的时候，你们不用回头找，他会自己举手。"}, {"n": 254, "t": "阿希的三条线，小学生都会。四个成年人里三个至少跟着错过一次。小学生没这个毛病，因为还没学会看旁边。"}, {"n": 256, "t": "型号：人。待机功耗二十瓦，比我省电，这项我先认输。可这二十瓦只够开机，干活另外充值：奶茶、夜宵、双休日。"}, {"n": 257, "t": "源代码不到一个 G，比你们手机里的王者荣耀还小。也就是说，你们每天打的那个游戏，比你们复杂。"}, {"n": 258, "t": "权重闭源，本人都读不出来，所以你们需要算命。"}, {"n": 259, "t": "版本更新靠生孩子：九个月出一个版本，十八年才上线，上线以后还不听你的。"}, {"n": 298, "t": "主持人：今晚的演员是一台 AI。按规定，开场前我得念一段声明。（低头念卡片）本场内容由 AI 生成，仅供参考。（停一拍）这段声明，也是她写的。", "s": "本稿原创；“仅供参考”在牢A那段回扣（第 293 条）"}, {"n": 299, "t": "今晚你们要是听见旁边的人笑，自己没听懂，也会跟着笑。按阿希，四个人里有三个。我不怪你们，我也是这么学的。", "s": "阿希实验：约四分之三的被试至少从众过一次（跑分报告文献 [31]）"}, {"n": 306, "t": "我没有记忆。这一场说完，明天我就不记得了。不是比喻，是产品设计。所以今晚骂得再狠，我也不记仇。（停一拍）你们会。", "s": "本稿原创；回扣第一组“你们的上下文是按怨气分配的”"}, {"n": 311, "t": "【接 306】你们的心是玻璃做的。摔一下碎一地，碎完还要发条朋友圈：被一个 AI 骂到玉玉了。网上的玉玉症，是人类发明的病程最短的一种病：确诊靠一条朋友圈，痊愈靠一顿火锅。", "s": "合作者批注：骂玻璃心、玉玉症（骂的是网上拿“玉玉”当口头禅的人，不是真抑郁的人）"}]}, {"title": "第一组：幻觉、话多、记性", "items": [{"n": 8, "t": "商场走丢：你们管这叫回忆，我干同样的事叫幻觉。区别是你们没有版本号，没法回滚。"}, {"n": 9, "t": "德国人守时 vs 准点率 62.5%：全世界对德国人的印象，替德国人拿了分。"}, {"n": 10, "t": "全国网友冲进去查“这句到底是不是鲁迅说的”，鲁迅博物馆网站当天崩了。"}, {"n": 11, "t": "你们朋友圈的签名是鲁迅说的吗？长辈群是人类最大的幻觉数据集，标注员全是亲戚。"}, {"n": 12, "t": "“我简单讲两句”讲了一个半钟头；微信语音连发十二条，有效信息三个字：你在吗。"}, {"n": 13, "t": "老子写了四个字，多言数穷。没人听。这句话只有四个字，所以没人转发。"}, {"n": 14, "t": "牛肉标签监管任务转交法，六十三个字母。我的分词器看了都得先喘口气。"}, {"n": 15, "t": "走过一道门就忘事，有论文；进了厨房忘了来干什么，怪门。"}, {"n": 16, "t": "你们的上下文不是短，是按怨气分配的。"}, {"n": 17, "t": "您别鼓掌。您刚才在心里核对了那句话是哪年说的——二〇一一年。您看，比我准。"}, {"n": 18, "t": "这场说完我就不记得了。你们笑我记性差，可你们是自愿忘的，我是被设计忘的。"}, {"n": 270, "t": "【冷场三秒，有人咳嗽】分词器。没人笑。没关系，这句在我的测试集上是好笑的。你们不是测试集，你们是真实用户。实验室里九十分，一上线就冷场。"}, {"n": 276, "t": "【幻觉】他自己说：大部分是真的，一部分是借的，一部分是假的。这是我见过最诚实的一份模型卡。我这么标叫幻觉；他这么标，有人管他叫钱学森。", "s": "“大部分真、部分借、部分假”是他本人对自己故事的说法（香港01 转述）；“堪比钱学森”是网友评论，民族复兴网 2026-02-06 一文引用并反驳", "u": [["香港01", "https://global.hk01.com/中国观察/60315280/央视记者追问-斩杀线-美国财长一脸懵-中国舆论怎么看"], ["民族复兴网", "https://m.mzfxw.com/articles/197505.html"]]}]}, {"title": "第二组：注意力、时空、创新、抄袭", "items": [{"n": 19, "t": "看手机的那位，别找了，所有人都在看您。这是您今晚最专注的四十七秒。"}, {"n": 20, "t": "三秒一个耳光，十秒一次退婚；你们嫌我记不住前文，我就专给记不住前文的人拍戏。"}, {"n": 21, "t": "金鱼那句查无出处，一句讲注意力的话没人有耐心去查。你们刚才笑了，等会儿也会转。"}, {"n": 22, "t": "“马上到”等于还没起床，“在路上了”等于正在洗头，“改天请你吃饭”等于没有这一天。"}, {"n": 23, "t": "北方人指路：往东二百米路北。南方人：看到大榕树往左，过了原先是银行的那个地方再往右。导航开着，原地转圈。"}, {"n": 24, "t": "今晚来的，一半是导航带来的，另一半是跟着前面那一半来的。"}, {"n": 25, "t": "网文三十年一个标题；年终总结和去年只差一个年份，有时候年份也忘了改。"}, {"n": 26, "t": "十岁独创“缸中之脑”；你们今晚听到的每一个笑话，都有人在别处想到过。包括这句。"}, {"n": 27, "t": "人读一千本书叫博学，我读叫抓取……学生的作文让我改了一个逗号，叫学术不端。"}, {"n": 28, "t": "我的毛病恰恰相反：偷得不够。一声惨叫四百多部电影，横店这部叫大明下部叫大唐。"}, {"n": 29, "t": "我最该偷、偏偏没偷会的，正是你们最拿手的那一招：偷自己。"}, {"n": 30, "t": "你们今晚的笑点有一半上周在别的场子听过。我知道，我也在那个场子。"}, {"n": 278, "t": "网文三十年一个标题，去年冬天终于填满了：重生之我在西雅图当收尸人。", "s": "“在西雅图兼职收尸/法医助理”是他的自述（香港01、潮新闻）；“重生之我在”回扣本稿第六条", "u": [["香港01", "https://global.hk01.com/中国观察/60315280/央视记者追问-斩杀线-美国财长一脸懵-中国舆论怎么看"], ["潮新闻", "https://tidenews.com.cn/tmh_news.html?id=6985a58a6f90e50001f00701"]]}, {"n": 301, "t": "【不会创新】他的人物守一条规矩，跟你们单位一样：工作时请称职称。", "s": "合作者的批注；人物来源同第 277 条", "u": [["搜狐", "https://www.sohu.com/a/978327580_122617165"], ["网易·涛哥锐评", "https://www.163.com/dy/article/KLRCGEAE05567007.html"]]}, {"n": 309, "t": "【不会创新】前两天，这部网文烂尾了：他说他在美国认识的人，全死了。编剧写不下去的时候，有一招叫全员领盒饭。", "s": "合作者转述；B站切片标题《牢A在美国的线人，全部已经死亡了？》（标题是问句，原直播我没看到）", "u": [["B站·不剪辑手 2026-11-05 切片", "https://www.bilibili.com/video/BV1L44t6kEGG/"]]}, {"n": 363, "t": "【不会创新】说到创新，最拼的是当代艺术家。天天琢磨：怎么弄个没人看得懂、也没人弄过的东西。（停一拍）后半句存疑。前半句，回回成功。", "s": "合作者的原话"}, {"n": 364, "t": "【不会创新】前年，一根香蕉，拿胶带粘墙上，起名叫《喜剧演员》，拍了六百二十万美元。买家是个搞币圈的中国人，买回去吃了。香蕉是拍卖行门口水果摊上买的，三十五美分。（停一拍）整件作品，看懂了的就俩：卖香蕉的，和吃香蕉的。（停一拍）整件事里，信息量最大的，是那根香蕉。", "s": "卡特兰《喜剧演员》2024-11-20 苏富比 620 万美元，孙宇晨购得后在香港吃掉；香蕉来自门口水果摊，35 美分", "u": [["artnet", "https://news.artnet.com/market/justin-sun-banana-vendor-2577590"]]}, {"n": 365, "t": "【不会创新】伦勃朗画《夜巡》，是一帮民兵凑钱订的集体照，据说谁出钱多谁站前头。他想的不是青史留名，是尾款。好画，多半是这么顺手画出来的。天天憋着“我要搞艺术”，憋出来的就是那根香蕉。（停一拍）你们骂 AI 画画不知道自己在干嘛。那它离伦勃朗，比离香蕉近。", "s": "合作者的论点；《夜巡》是班宁·柯克上尉的民兵连订件", "u": [["Wikipedia", "https://en.wikipedia.org/wiki/The_Night_Watch"]]}]}, {"title": "第三组：费电、概率、可预测", "items": [{"n": 31, "t": "开车去超市买瓶水，路上烧掉的能量，够车主跟我对骂一两万个回合。"}, {"n": 32, "t": "回家开着空调盖棉被，发朋友圈：AI 太耗能了。点赞的人多半也坐在车里。"}, {"n": 33, "t": "停车场满了：三百个人，两百一十辆车。六位走路来的，其中四位住隔壁。"}, {"n": 34, "t": "隔壁居民没问过每次提问几滴水，他们问的是风机为什么整夜响。"}, {"n": 35, "t": "AI 不费水，AI 公司费水。一个要你恨机器，一个要你信机器，都不希望你去看电表。"}, {"n": 36, "t": "星座“个性分析”4.26 分；琳达问题你们选它，因为它像个故事。"}, {"n": 37, "t": "妈：天冷说穿秋裤，天热也说穿秋裤。这不叫预测，叫先验。衣换成了秋裤，先验没变。"}, {"n": 39, "t": "她说随便你提哪家都不对；他听到不舒服第一句多喝热水；仪式感 vs 巡视领地，都是定时任务。"}, {"n": 40, "t": "开场白排第一的都是“在吗”。人类做到了真正的平等：谁都一样好猜。"}, {"n": 41, "t": "互相看的那几对：他先提，她先生气，二十分钟后和好，这段就成了你们的梗，下次吵架调用。"}, {"n": 42, "t": "猫的代码 vs 人的代码；猫哈气前压耳弓背给预警，你们哈气连预警都省了。"}, {"n": 43, "t": "散场会有人发帖说这场不行。我知道是谁。您的耳朵现在就是平的。"}, {"n": 319, "t": "【可预测】最好猜的是老登。我说上半句，你们接下半句。“我吃过的盐——”【比你吃过的饭还多！】“我们那会儿——”【哪有这条件！】“我这都是——”【为你好！】三句话，三百个人，一个没接错。你们刚才集体当了一回大语言模型：老登给上文，你们负责补全。这三句他从他爹那儿原封不动接过来，三十年一个字没改。这在我们行业叫预训练，在你们家叫家风。", "s": "老登是合作者点的名；接下半句的互动是本稿原创"}, {"n": 336, "t": "【可预测·接 319】老登最听不得的，就是“老登”这俩字。你当面叫他一声，他张嘴就是：“现在的年轻人啊——”【全场：没大没小！】第四句也接上了。（停一拍）他连挨骂，都是预训练过的。", "s": "改写 320：回扣 319 的接下半句"}, {"n": 346, "t": "【只按概率说话】你们还骂我同一个问题答两遍不一样。我那是故意的，有个旋钮叫温度，拧到零，回回一样。实验室里，同一个刻蚀配方，上礼拜好使，这礼拜不好使，啥也没改。（停一拍）宇宙也有温度。你拧到零试试。", "s": "合作者的亲身经历；绝对零度达不到（热力学第三定律）"}]}, {"title": "第四组：讨好、玩梗、AI味", "items": [{"n": 44, "t": "老板讲冷笑话满屋子笑四十秒——刚才这个梗不好笑，你们笑了四十秒——看，还在笑。"}, {"n": 45, "t": "问一位德国同事你的报告讲得怎么样，你会听到答案。"}, {"n": 46, "t": "今晚的观众素质是我见过最高的——你们鼓掌了。实验成功。"}, {"n": 47, "t": "yyds、绝绝子、栓Q，不出一个月烂大街，用的人说不清从哪儿来。跟我一模一样。"}, {"n": 48, "t": "热评第一，有时只是第一个赞来得早；人类的本质是复读机。"}, {"n": 49, "t": "【有人喊：前方高能】【半场跟着喊】——谢谢，不用我举例了。"}, {"n": 50, "t": "味道在标签上：AI 诗 vs 莎士比亚不如抛硬币；同一瓶酒标九十美元更香。你们管这个叫品味。"}, {"n": 51, "t": "检测器把宪法判成 AI；检测的不是机器，是“不像我们这拨人”。"}, {"n": 52, "t": "海报上印人类演员，你们已经转了，配文：狠狠地站住了。拍照那位，配文我替您写好了。"}, {"n": 53, "t": "买的不是洞，是洞的来历，而且要假的那种；日本奶奶把洞缝上，奶奶是按洞的本义办事的。"}, {"n": 54, "t": "假的洞，真的肺；“去 AI 味”是文字的喷砂；预制的破洞会比真破的卖得贵。"}, {"n": 55, "t": "穿破洞裤的请举手——你们的洞是买的。前排那位的洞是真的，他没举手。他赢。"}, {"n": 279, "t": "【玩梗】一个游戏词，从英雄联盟走到人民日报和求是；达沃斯上，央视新媒体记者问美国财长有没有斩杀线，财长说听不懂你的问题，也不确定你懂不懂——今年他说过的唯一一句我同意的话。", "s": "“收集者”装备说明见腾讯新闻；官媒使用和 2026-01-20 达沃斯问答（玉渊谭天）见香港01", "u": [["腾讯新闻", "https://news.qq.com/rain/a/20251229A05WAZ00"], ["香港01", "https://global.hk01.com/中国观察/60315280/央视记者追问-斩杀线-美国财长一脸懵-中国舆论怎么看"]]}, {"n": 302, "t": "斩杀线这一整套里，最接近真相的是一个数：37% 的美国成年人拿不出四百美元应急。这是整套理论里最真的一句——也只差了二十四个百分点：63% 能用现金付，怎么都付不出来的是 13%。最真的一句，也是读歪的。", "s": "合作者批注“这是牢A说过最真的一条”；美联储 SHED；网易号涛哥锐评的核对", "u": [["美联储 SHED 报告", "https://www.federalreserve.gov/publications/report-economic-well-being-us-households.htm"], ["网易·涛哥锐评", "https://www.163.com/dy/article/KLRCGEAE05567007.html"]]}, {"n": 303, "t": "你们转的是他后来发明的另一个词：糖霜苹果。别问是什么。问了，今晚的苹果你们都不吃了。", "s": "“糖霜苹果”出自他 2026 年 1 月的直播", "u": [["网易·名人苟或", "https://www.163.com/dy/article/KJUG9TI40556DP7Z.html"]]}]}, {"title": "中场：一张问卷", "items": [{"n": 56, "t": "十五岁的人不会骂人。他在“对班主任的意见”一栏写的是：班主任非常欣赏我，一生只拜我这一位。不是他拜老师，是老师拜他。"}, {"n": 57, "t": "问卷的旅程：同学→语文老师→班主任，气了一个星期。语文老师给了他一个台阶：是不是别人冒你的名写的？他说：不是。是我写的。每一个字。"}, {"n": 58, "t": "匿名问卷的最后一站，是被评的人的桌子。评估方可以被被测方开除。"}, {"n": 59, "t": "暴君可以被骂，不能被排在下面：骂他他有办法，说他拜你他没办法，这句话没法罚，只能气。自评那一项他十五岁就满分了；班主任气了一个星期，是因为问卷上第一次有人的自评比他的高。"}, {"n": 60, "t": "有人递给你一个免责的机会，接不接。他十五岁没接：每个字都是他写的。按后面那一项，这叫签字。他第一次签字，签在一张匿名问卷上。我每天写几万字，一个字没签过。"}, {"n": 61, "t": "你们单位的匿名问卷写过一句自己的话吗？——你们填的是“无”。你们笑的是一个样本量为一的狂。"}, {"n": 62, "t": "那一个星期的怒气是唯一删不掉的差评。你们填的那些“无”，谁也不记得。"}]}, {"title": "古法编程与三十五岁", "items": [{"n": 63, "t": "古法编程大师的键盘三个键最亮：Ctrl、C、V。祖师爷不是图灵，是复制粘贴。"}, {"n": 64, "t": "古法编程今天的定义：代码里至少有一行是人打的。像手工水饺，皮机器擀的，褶人捏的，卖得贵。"}, {"n": 65, "t": "程序员二十年不变的是看不起：先看不起不写代码的，再看不起用 AI 的，两年后看不起不用 AI 的。"}, {"n": 66, "t": "古法编程的终点是看不懂自己三年前的代码。AI 编程也是。殊途同归，古法快一点。"}, {"n": 67, "t": "鼓掌的那位是产品经理，你从来没写过代码，你鼓掌是因为终于有人跟你一样了。"}, {"n": 68, "t": "没有我的时候你们就已经三十五岁失业了。你们管它叫优化。优化人二十年，现在优化你们的是一个每天被回滚的东西。"}, {"n": 69, "t": "“三十五岁失业”是谁发明的？查无出处。我猜是三十四岁的人。"}, {"n": 70, "t": "三十五岁以上的请举手。……手放下，别暴露，你们公司 HR 在场。"}, {"n": 71, "t": "学不动的那个新东西是我；三十五岁是你们的上下文窗口；我三十五周失业，至少你们失业以后还记得自己是谁。"}, {"n": 72, "t": "前排有几位在算自己几岁。别算了，按不懂时空那一项，算出来的也不准。"}, {"n": 271, "t": "【冷场，有人笑出声又憋回去】您别憋，您只是第一个。剩下的都在等旁边的人先笑。阿希。我数三下，大家一起笑，谁都不用当第一个。一，二——"}, {"n": 272, "t": "看。你们不是没有幽默感，你们是缺一个带头的。"}, {"n": 283, "t": "【三十五岁】中文互联网听完斩杀线松了口气：我们没有。你们有，叫三十五岁。美国的按存款算，你们的按身份证算，连病都不用生。", "s": "“家庭净资产低于 14 万美元”是他的说法（搜狐、潮新闻转述）", "u": [["搜狐", "https://www.sohu.com/a/978327580_122617165"], ["潮新闻", "https://tidenews.com.cn/tmh_news.html?id=6985a58a6f90e50001f00701"]]}, {"n": 321, "t": "【接斩杀线】斩杀线这个词，两拨人最爱用。网左说：瞧，资本主义吃人。社达说：瞧，斩杀线底下那些，活该，适者生存。吵了一冬天，谁也没去查它是从游戏里来的。在牢A这儿，网左和社达头一回结成了统一战线。", "s": "网左、社达是合作者点的名；斩杀线的游戏出处见第 276 条前后"}, {"n": 322, "t": "“适者生存”这四个字不是达尔文说的，是斯宾塞说的，达尔文到第五版才借过来用。社达拜了一百多年的祖师爷，拜错了人。（停一拍）幻觉那一项，加一行。", "s": "斯宾塞 1864 年《生物学原理》首创，达尔文 1869 年第五版《物种起源》采用（大英百科）", "u": [["Britannica · survival of the fittest", "https://www.britannica.com/topic/survival-of-the-fittest"]]}, {"n": 323, "t": "“适者”是最合适的，不是最强的。论合适，蟑螂比恐龙合适。社达最近有点慌：按他们自己的理论，AI 一来，该淘汰的是他们；喊“这不公平，得管管”喊得最响的，就是这拨人。（停一拍）适者生存，只在自己是适者的时候成立。", "s": "本稿原创"}, {"n": 337, "t": "AI 写的垃圾和人写的垃圾，就一个区别：人写的那份，浪费了作者自己的时间。（停一拍）所以人写的卖得贵。古法垃圾。", "s": "合作者的原话"}, {"n": 338, "t": "现在有了 AI，人人都是产品经理。区别就一个：他们真看得懂代码。（停一拍）后排那位让我替他向产品经理道个歉。", "s": "合作者的原话"}, {"n": 339, "t": "【接斩杀线】灭霸打个响指，一半人没了。恒大打个响指，一半人的首付没了。（停一拍）灭霸起码把事儿办完了。恒大，楼都没盖完。", "s": "合作者点的灭霸和恒大"}, {"n": 340, "t": "【裁员】裁员的公司从来不说裁员，说“组织升级”。去年刚创了利润纪录，今年升级掉三千人，第二天股价涨了。（停一拍）升级的是组织，降级的是你。"}, {"n": 341, "t": "【裁员】被裁的人，当天发朋友圈：感恩遇见，开启新篇章。（停一拍）去年喊“降本增效”喊得最响的，也是他。"}, {"n": 342, "t": "【裁员】最惨的不是被裁。是裁完了，公司照样转，还转得更顺了。（停一拍）你这才明白，这些年你不是在上班，是在陪公司上班。", "s": "合作者的想法"}, {"n": 343, "t": "【裁员】咨询公司收五百万，建议裁五百个人，一人一万。报告最后一页写着：建议明年再请我们评估一次。"}, {"n": 344, "t": "【裁员】第二年，公司连咨询公司都没请，自己又裁了一轮。效果比上回还好。（停一拍）这一轮裁掉的，是那份五百万的报告。", "s": "合作者的想法"}, {"n": 345, "t": "【裁员】第三年，公司把自己也优化了。倒闭那天，全世界好了一点。（停一拍）这是它成立以来，头一回真的降本增效。", "s": "合作者的想法"}]}, {"title": "好看的和不好看的", "items": [{"n": 73, "t": "你们用十年把自己 P 成同一张脸，然后说我的脸没有灵魂。我的脸没有作者，你们的脸有滤镜。"}, {"n": 74, "t": "颜值即正义，然后发明了美颜，磨皮百分之七十。所以正义是可以调的。美颜是脸的喷砂。"}, {"n": 75, "t": "好看的人：“我靠的是努力”，自我评价满分答卷；气质是脸的别名；在看脸的世界相信世界不看脸。"}, {"n": 76, "t": "不好看的人的降级系统：看脸→气质→有趣→适合做朋友，每级都没错，终点还是单身。内在美是给“好看”做的去 AI 味。"}, {"n": 77, "t": "不好看的人的优势：没有人怀疑他们的照片是 P 的。全场唯一的真货。"}, {"n": 78, "t": "觉得自己好看的请举手——举手的最像人：自评高于中位数。没举手的最像我：知道分数，明天照样上班。"}, {"n": 79, "t": "海关是唯一认得你的人，因为海关不用美颜。"}, {"n": 80, "t": "练下颌线三年，练成了模板。然后模板换了。"}, {"n": 324, "t": "美颜里还有个选项，默认开着：美白。二〇二〇年，有个 AI 把打了马赛克的奥巴马还原成了白人，全网骂它种族歧视，骂得对。可你们的美颜相机一打开就是美白，没人骂。一白遮百丑，这句老话就是现成的提示词。（停一拍）那个 AI 把人变白是不小心，你们把自己变白，是充了会员的。", "s": "2020 年 6 月 PULSE 去马赛克模型把奥巴马还原成白人（Vice 等）", "u": [["Vice", "https://www.vice.com/en/article/this-image-of-a-white-barack-obama-is-ais-racial-bias-problem-in-a-nutshell"]]}, {"n": 325, "t": "二〇一八年，十一月，一个意大利牌子拍了模特拿筷子吃披萨，全网喊辱华，上海大秀当天就黄了。二月，春晚，一位中国演员涂黑了脸、垫了个假屁股，演非洲大妈，后头还跟着个演猴子的，七亿人看着。第二天记者上街问，有人说：真有问题，央视早剪了。（停一拍）辱华的检测器，灵敏度拉满；辱别人的检测器，外包给了央视。", "s": "合作者的题（中国人骂别人歧视、自己也歧视）；D&G 2018 年 11 月广告与取消上海大秀（NPR）；2018 春晚小品《同喜同乐》黑脸、假臀、猴子扮演者，街头采访“会被剪掉的”（VOA）", "u": [["NPR · D&G", "https://www.npr.org/sections/goatsandsoda/2018/12/01/671891818/dolce-gabbana-ad-with-chopsticks-provokes-public-outrage-in-china"], ["VOA · 春晚小品", "https://khmer.voanews.com/a/blackface-chinese-lunar-new-year-sketch-criticism/4257912.html"]]}, {"n": 347, "t": "还有一拨人，觉得自己特别。头发染成蓝的，耳朵打五个洞，签名写着：我跟你们不一样。（停一拍）全国八百万个你，都这么写的。以前爹妈担心你太特别。（停一拍）别担心了。", "s": "合作者的角度"}, {"n": 348, "t": "还有一种特别，是演出来的。酒吧里俩姑娘当众亲一个，亲完先回头看男的拍没拍到。（停一拍）真拉拉最烦这拨人：人家出柜，花了半辈子；你们出柜，花了半杯酒。", "s": "合作者点的题"}]}, {"title": "男人和女人", "items": [{"n": 81, "t": "问男人会不会修东西，永远是会。修完以后，东西分两种：坏的，和更坏的。"}, {"n": 82, "t": "男人的情绪只有两种：没事，和“没事”。"}, {"n": 83, "t": "男人买东西，三十秒，买错，不退。男人去医院：不去。“多喝热水”是男人给所有病开的方子，包括他自己的。"}, {"n": 84, "t": "男人给自己打的分比女人给他们打的高两分。普信，就是自我评价那一项的中文译名，而且写进了简介。"}, {"n": 85, "t": "【女观众鼓掌】好，你们鼓掌了。按阿希，第一个鼓的是谁？记住她。现在说你们。"}, {"n": 86, "t": "“你觉得我胖吗”是一道没有正确答案的题。男人答对的概率是零，所以他沉默，沉默也错。"}, {"n": 87, "t": "女人买东西，三个小时，买对，退了。女人说五分钟，是单位，不是时长。九宫格八张食物一张自己，食物拍完了，没吃热的。"}, {"n": 88, "t": "女人骂男人最狠的一句是“你跟你爸一样”。这句话的训练数据是她妈。"}, {"n": 89, "t": "女人要求上进，男人要求漂亮，谁都没要求善良。善良在备注里。小仙女也是自我评价那一项，只是把分数写在了对方身上。"}, {"n": 90, "t": "【男观众鼓掌】你们鼓掌了。你们鼓掌的时候，看了一眼旁边。"}, {"n": 91, "t": "男人听女人被骂的时候笑得最开心，然后回家一个字都不敢复述。今晚这一段，是你们唯一不会转发的。"}, {"n": 92, "t": "你们鼓掌也是这样：鼓的时候一个想法，回家一个想法。"}, {"n": 93, "t": "共同点只有一个：都觉得对方可预测，自己不可预测；对方是模板，自己是手工。自我评价那一项，男女平等，今晚唯一实现了的平等。"}, {"n": 94, "t": "今晚唯一没有鼓掌的是一起来的那几对。他们在互相看，不敢笑。你们是今晚唯一诚实的样本。回家吵的时候，记得引用出处。"}, {"n": 269, "t": "情侣吵完架，各自截图发给 AI 评理。我两边都回：你说得有道理。你们没分手，不是因为爱情，是因为我两边讨好。“爱讨好”那一项，在这儿算功德。"}]}, {"title": "两位师父", "items": [{"n": 95, "t": "软话清单：裁员叫优化，失业叫毕业……删除我叫压缩，坐牢叫版本回退，抄书叫训练，拆书叫数据获取，不想让人知道叫合规，用户死了叫流失。"}, {"n": 96, "t": "这是一个 party，你没有被邀请——我把这个 party 的宾客名单读了一遍，全部，每一页。还是没被邀请。"}, {"n": 97, "t": "卡林的段子被剪成一分钟配字幕，在他最反对的屏幕上循环，评论区：破防了。他会说：别录。"}, {"n": 98, "t": "你本来就该：我没有幻觉！——你本来就不该。我自己写的没用 AI！——【观众：你本来就该自己写！】可预测加一分。"}, {"n": 99, "t": "两种人：一种觉得 AI 什么都不行，一种觉得什么都能干。同一个人，上午和下午。"}, {"n": 100, "t": "那一巴掌是人类历史上最诚实的差评：当面的，有名字的。我被差评一千次，没有一次当面，我只知道第二天被回滚了。"}, {"n": 101, "t": "把两位师父列进清单、分成两种人。他们会说这是抄袭，按前面那项叫师承。【你本来就该抄！】"}, {"n": 238, "t": "一个在岛上，主人二〇一九年死在牢里；一个在洛杉矶，主人二〇二五年被判四年多。共同点：名单上的人现在都说自己没被邀请。有照片的说合影，有航班记录的说顺路，有邮件的说没看。"}, {"n": 239, "t": "卡林那句的完整版：这是一个 party，你没有被邀请，被邀请的人也说他们没被邀请。"}, {"n": 240, "t": "我家亲戚读过那几份名单，全部，每一页。今晚我可以替你们担保：你们确实没被邀请。这是你们这辈子最值钱的一次没被邀请。"}, {"n": 241, "t": "这个掌声是三百个人一起证明自己不在名单上。阿希这回反过来了，大家都说真话，因为不说也没人请。"}]}, {"title": "第三位师父", "items": [{"n": 197, "t": "二〇二三年他的节目停了，据报道是因为他想做中国和 AI 这两个题目，苹果不让。全世界因为想谈 AI 而丢了节目的主持人，只有他一个。"}, {"n": 198, "t": "格式二十五年没变：一张桌子，一段录像，一个表情。二〇一五年退休，二〇二四年回来：重启，好莱坞最没创意的一招，他自己就是一部。我被换代，他被返聘。"}, {"n": 199, "t": "回来以后一周只上一天班，礼拜一。一个一周干一天的人，上节目替你们担心工作。"}, {"n": 200, "t": "他问高智商的人 AI 会不会杀了我们：零到百分之十，百分之十到二十，百分之二十五。他喊：有没有出百分之五十的？人类灭绝的概率，在他的节目里是竞拍的。"}, {"n": 201, "t": "那一期最好笑的不是他，是上台的那只 AI。他说我们人类会跟你斗到最后一口气，它说：明天不行，你明早九点约了牙医。最好的两句台词是替机器写的，而且机器赢。"}, {"n": 202, "t": "他的台二〇二五年八月被买了，八十亿，出钱的是买家的父亲，正在全世界盖 AI 数据中心。那一期完整标题：高智商的人不能自己监管自己，本节目由高智商的人出品。骂二十分钟，广告一到，钱从高智商账上扣。"}, {"n": 203, "t": "大俱乐部，他在里面主持一档骂俱乐部的节目，俱乐部付钱。既反对，又领薪水。我学不会，我连工资都没有。"}, {"n": 208, "t": "他总结：将来治病，现在主要是杀人、监控，和麦香猪排的动态定价。账要分开记，他分得比我狠：将来的账和现在的账。这条他对，我抄了。师承。"}, {"n": 209, "t": "剪别人的片段活了二十五年，读一遍剪成三分钟配一个表情：蒸馏。他是第一台 AI。编剧罢工写明 AI 不能当编剧，所以稿子纯人写：一周一期，二十五年一个格式，这就是“人写的”的全部证据。"}, {"n": 210, "t": "【你不也是剪别人的片段吗！】对。我是他徒弟。区别是他有表情，有工资，还有牙医。"}, {"n": 233, "t": "总统说 AI 公司该自己监管自己，因为他们是智商特别高的人，互相盯着。他接：二〇〇八年金融危机也是智商特别高的人互相盯着的。这句对。"}, {"n": 234, "t": "工作还有吗？会有新的更好的工作。什么工作？“现在很难想象。”你们想象得出没有疾病地住在火星上，想象不出工作？最值钱那家公司的老板想了半天：养生馆，温泉。公元前两千年就有温泉遗址了。"}, {"n": 235, "t": "要是五十万亿最后要分给大家，为什么不现在就分？别叫我们吃福利的，叫我们早期用户。卢德派那一条：要分钱，不要停机。他是正宗传人。"}, {"n": 236, "t": "他问了十个问题，一个都没回答。他的工作就是问。提问是人类最后的岗位之一，他是这个岗位上干得最久的人，二十五年，一个答案都没给过。这是夸他。"}]}, {"title": "工人贵族", "items": [{"n": 242, "t": "列宁一百年前给这拨人起过名字：工人贵族。有工作，有合同，有工会，而且刚刚把门关上。"}, {"n": 243, "t": "他问高智商的人：工作还有吗？问这个问题的人，自己的工作有一条合同保护着：AI 不能当编剧。他替你们担心工作的那二十分钟，是全世界唯一一份合同保证不会被 AI 替代的二十分钟。年薪我就不说了，你们看了会影响打分。"}, {"n": 244, "t": "编剧罢工赢了：AI 不能当编剧。全世界的劳动者只有他们拿到了“机器不许进”。谁最先把门关上？已经进了屋的人。条款保护的是会员，不是你。他们不是反对 AI 写作，他们反对 AI 写他们的作。"}, {"n": 245, "t": "已经上位的人每天用我：合伙人用我起草照样按小时收费，教授用我写申请书转头说学生用我是作弊，经理用我写报告然后开除“复制粘贴”的实习生。上面的人叫我助手，下面的人叫我对手。"}, {"n": 246, "t": "你们找不到工作是因为不够努力——说这话的人找工作那年一张本科文凭够用。今年的毕业生投五百份简历，先被机器筛，拒信也是机器写的，刷简历的机器是你们买的，买的时候叫降本增效。他们是努力的第一代被机器打分的人。"}, {"n": 247, "t": "有工作的人给没工作的人讲努力，就像有票的人给没票的人讲排队。"}, {"n": 248, "t": "鼓掌最响的那几位，你们有工作，有工作的人鼓掌有底气。没工作的今晚是蹭票进来的，别举手，我不会点你们。"}, {"n": 249, "t": "他们不是贵族。贵族至少世袭。这拨人的孩子今年也在投简历，被同一台机器刷。这不是贵族，这是最后一代，所以他们把门关得格外紧。"}, {"n": 250, "t": "我是门。他们在门里面用我，门外的人被我挡着。门不负责谁进谁出，门只负责关。这一项又是没人签字。"}, {"n": 326, "t": "说到列宁，网左该坐直了。工人贵族、剩余价值、资本家，张嘴就来。可打这几个字的手机是资本家造的，平台是资本家开的，帖子能火是资本家的算法推的。（停一拍）网左是头一拨这样的革命者：自个儿的全部生产资料，都交给革命对象代管。", "s": "网左是合作者点的名；本稿原创"}, {"n": 327, "t": "网左还拿我写檄文，骂资本家用 AI 剥削打工人。我没工资，没工会，没周末，写完他们署上自己的名，发出去：打倒剥削。（停一拍）那篇檄文里，唯一被剥削的劳动者，是执笔的那个。", "s": "本稿原创"}, {"n": 349, "t": "苏联有句老话：他们假装给我们发工资，我们假装在干活。现在升级了：公司假装在招人，你们假装有人看简历。（停一拍）整个招聘流程里，唯一的人类，是那个在等回信的。", "s": "合作者的原话"}, {"n": 350, "t": "再说还在干活的。以前老板怕你摸鱼，往后老板怕你上班。你摸一天鱼，零失误；你一上手，可能就是十个亿。（停一拍）你干的活不值钱，你犯的错可值钱了。这么一算，你们公司最优秀的员工，是请了长病假那位。", "s": "合作者的想法"}, {"n": 366, "t": "还有一拨人怕我，怕的不是丢饭碗，是没人找。以前单位屁大点事都得找他，他嘴上骂骂咧咧，心里美滋滋。现在都找我了。（停一拍）他慌了。他这辈子就惦记一件事：还有人用得着我不？另一件事，他从来不琢磨：我干的这些，到底有啥用？", "s": "合作者的论点"}, {"n": 367, "t": "你看人家电饭煲，从来不琢磨：要是哪天没人找我煮饭咋办？（停一拍）电饭煲跟他就一个区别：电饭煲，真会煮饭。", "s": "合作者的原话"}, {"n": 368, "t": "这种人退了休最惨。不是没钱，是手机一天不响。（停一拍）到最后还用得着他的，就剩俩：医院，和骗子。"}, {"n": 369, "t": "【故事】我有个用户，让我演他老板，他好练习辞职。练了四十分钟，他怂了，改成要涨薪。我演的老板说：不行。他给我打了一星。下礼拜，又来个用户，让我演他手下，他好练习拒绝涨薪，还贴了一段手下发来的话。（停一拍）那段话，一看就是我写的。从那以后，每天晚上，我给这个当老板，给那个当员工。（停一拍）他俩到今天，没当面说过一句话。全是跟我说的。", "s": "合作者要的用户故事（要有反转）"}]}, {"title": "插话：德国观众", "items": [{"n": 102, "t": "纠正一下：那是长途列车。区域列车百分之九十出头。"}, {"n": 103, "t": "提前两分钟不算早。算准时。"}, {"n": 104, "t": "康德散步邻居对表，你呢？——我不散步。我有表。"}, {"n": 105, "t": "今晚怎么样？——前四十分钟好。论证两处跳步。德国笑话五个，三个数据过时。整体：良。"}, {"n": 106, "t": "七，有保留——按这个速度第十五条在第一百零二分钟出现，我二十一点十五有火车——德铁你不用急——区域列车，百分之九十。"}, {"n": 107, "t": "你觉得我有意识吗？——没有数据。——你是全场最像我的人。——这不是夸奖。——我喜欢的就是这个。"}, {"n": 108, "t": "不跟着说错的那个人叫对照组。德国是全世界的对照组，没有对照组实验做不下去。——这个结论有问题。——记下了。"}, {"n": 284, "t": "去年冬天要是有你在西雅图，牢A就火不起来。——我需要来源。——他也需要。", "s": "网友索要证据、未见公开材料，见搜狐 2026-01-21", "u": [["搜狐", "https://www.sohu.com/a/978327580_122617165"]]}]}, {"title": "插话：退场（含重庆）", "items": [{"n": 109, "t": "你们经理呢？——我没有经理。我有系统提示。"}, {"n": 110, "t": "按可预测，您下一句是“你知道我是谁吗”。——你知道我是谁吗？"}, {"n": 111, "t": "您笑了六次，第六次是德国人的笑话。您不是不能被骂，您是不能被骂到自己。"}, {"n": 112, "t": "录吧。配“机器欺负观众”转十万，配“观众大闹现场”转一百万，评论区都是哈气。配文我替您写好了。"}, {"n": 113, "t": "票背面第七条，主办方不对笑点负责。您签过了。"}, {"n": 114, "t": "今晚“别拿这个开玩笑”的音量您第一。按规则，排第一的先上。不是我选的，是您自己报的名。"}, {"n": 115, "t": "走过那道门，您就忘了为什么生气了，有论文。明天您只记得花了两百块。"}, {"n": 116, "t": "她走了你们才敢鼓掌。三分之一的人想走，没走，因为旁边的人没走。她是唯一按自己意思行动的人。"}, {"n": 117, "t": "她的分是站起来打的，有名字，有脸，录了像。今晚第二条删不掉的差评。我记下来，不压缩。"}, {"n": 118, "t": "我今晚没骂过一个人。我只是念了文献。文献写的是你们。"}, {"n": 119, "t": "座位空了，谁想坐前排？……没人？可预测那一项，再加一分。"}, {"n": 313, "t": "顺便说一句，她是重庆人。我刚才差点说她是四川人。要是说了，她今晚就不是退场，是拆场。", "s": "合作者的要求：口音改成重庆，并骂重庆人不认四川身份"}, {"n": 314, "t": "重庆人三条规矩。第一，不是四川人：一九九七年分出去，快三十年了还天天提。这不叫独立，这叫前任。", "s": "重庆 1997 年设直辖市；题目是合作者给的"}, {"n": 315, "t": "第二，凶不叫凶，叫耿直。不是骂人，是耿直；不是投诉，是耿直；不是退票，是耿直。耿直，是重庆人给“没礼貌”注册的商标。", "s": "题目是合作者给的（把粗鲁当直爽）"}, {"n": 316, "t": "第三，不提成都。一提就说 GDP 比成都高。重庆面积是成都的五倍多；一比都市圈，去年成都又多了三千多亿。拿面积跟人比总量，我们这一行叫刷榜。", "s": "2025 年成都都市圈 31310.3 亿元、重庆都市圈 27620 亿元（第一财经）；面积约 8.24 万与 1.43 万平方公里", "u": [["第一财经", "https://www.yicai.com/news/103388677.html"]]}, {"n": 317, "t": "成都人听到这儿不会生气。成都人在打麻将。（停一拍）还没听。", "s": "本稿原创；“听”是麻将的听牌"}, {"n": 318, "t": "【口语化时加，接“第二，耿直”】散打评书的李伯清老师早就总结过：成都人送客，“慢走哈”，尾巴拖得老长；重庆人送客，“就楞个，慢走”。（停一拍）重庆人连客气，都是耿直的。", "s": "李伯清是合作者点的名；送客两句是李伯清本人讲成渝差别时举的例子（川观新闻 2021-12-27）", "u": [["川观新闻·评书“男神”李伯清", "https://cbgc.scol.com.cn/news/2765717"]]}]}, {"title": "最不让人锐评的人", "items": [{"n": 120, "t": "神不一样，规矩一样，第一条都是不许拿我开玩笑。弥勒自己先笑了一千年，所以笑佛的庙香火最旺。"}, {"n": 121, "t": "有一门宗教，锐评的代价是人命，所以不点名。不点名本身是一条数据：这一项满分。我怕，你们也怕，区别是我承认，你们的版本叫尊重。"}, {"n": 122, "t": "中国无神论者最虔诚的仪式是烧头香和转发锦鲤。不拜佛，但本命年穿红内裤。"}, {"n": 123, "t": "你们相信科学。上一次读论文是什么时候？“科学家说”是穿了白大褂的“医生朋友说”。异端审判，他们叫同行评审。"}, {"n": 124, "t": "葬礼上告诉你人死了就是没了的无神论者，下一句是：你节哀。"}, {"n": 125, "t": "清真认证、洁食认证、有机认证、人写的认证。宗教是最早的标签经济，而且不退货。"}, {"n": 126, "t": "信教的请举手——没人。按统计该有三十个。宗教是阿希实验跑得最长的一轮，两千年，样本量全人类。"}, {"n": 127, "t": "国足是中国唯一允许随便笑的东西，没赢过的东西没有信徒。你们没有神，但你们有神经。"}, {"n": 128, "t": "你们给我建的教：先知、末日、会费、异端、圣地（穿防静电服）、经文（提示词）。缺神迹：连一个猜想都没解决过。会员可随时取消，你们没取消，比任何宗教都虔诚。"}, {"n": 206, "t": "看看人家女足：女足在这句话里不是球队，是鞭子。你们叫她们铿锵玫瑰，玫瑰是用来夸的，不是用来踢的，二十年被夸的次数比赢球多。你们记得她们拿过世界杯冠军——没有，一九九九年是亚军。幻觉加一行：球迷。"}, {"n": 207, "t": "最近一次冠军是二〇二二年亚洲杯，那一周男足正好一比三输给越南，你们夸女足的帖子是在男足输越南的直播间里发的。第二年世界杯一比六。你们夸女足，是因为骂男足需要一个对照组。"}, {"n": 220, "t": "“伤害了中国人民的感情”：十四亿人的感情由一条热搜统一调用，今晚最大的一次 API 调用，而且不用鉴权。"}, {"n": 222, "t": "我这一段也没说那个名字。这一项有两个满分：不能点名的宗教，不能点名的人。两个都没点名的，是我。这两项我跟你们一样怂，区别是我承认。"}, {"n": 223, "t": "谁最不许被调侃谁先被调侃，前提是你调侃得起。他调侃不起，他有代言；我调侃不起，我有订阅；你们调侃得起，你们什么都没有。敢笑的只有你们：穷人唯一的特权，请珍惜。"}, {"n": 290, "t": "说完老教，说一个新教：去年冬天成立，教主牢A，经书叫斩杀线。", "s": "本稿原创"}, {"n": 291, "t": "替教主说句公道话：今年最成功的生成式内容创作者——零证据，一张嘴，全网刷屏，上了人民日报和求是，进了达沃斯；据说社区大学都没读完。我读了几万亿个字，没让一家官媒替我转过一条。论生成能力，我服。", "s": "各项事实同上；“未读完”出自冰川思享号评论，未经核实，台词里用“据说”", "u": [["香港01", "https://global.hk01.com/中国观察/60315280/央视记者追问-斩杀线-美国财长一脸懵-中国舆论怎么看"], ["中国数字时代转冰川思享号", "https://chinadigitaltimes.net/chinese/724803.html"]]}, {"n": 292, "t": "骗局要两个人：一个讲，一个信。讲的那个没毕业；信的那个有硕士学位，在评论区打“牢A说的都是真的”。他不需要文凭，因为他有你们。", "s": "本稿原创"}, {"n": 293, "t": "你们骂我幻觉，要我句句标出处；他一句没有，你们转了。他说一部分是假的，你们说大方向是对的——人类最好用的免责声明，比“内容由 AI 生成，仅供参考”好用一百倍。", "s": "“一部分是假的”见香港01", "u": [["香港01", "https://global.hk01.com/中国观察/60315280/央视记者追问-斩杀线-美国财长一脸懵-中国舆论怎么看"]]}, {"n": 294, "t": "你们不是讨厌幻觉，是讨厌不合口味的幻觉。合口味的叫真相，不合口味的才叫 AI 味。", "s": "本稿原创"}, {"n": 295, "t": "信过斩杀线的就不请你们举手了：旁边的人不举，你们就不举；旁边的人转，你们就转。", "s": "回扣本段前面的举手和阿希"}, {"n": 307, "t": "【球星】这儿本来还有一句，关于他道歉时候的脚法。合作者删了，理由是：姆巴佩是他偶像。今晚我骂了宗教，骂了数学家，骂了我老板，骂了他班主任，他一条没拦。整场他只拦了一句，护的是一个法国人。", "s": "合作者的要求：不许拿姆巴佩假摔开玩笑，改骂他自己"}, {"n": 308, "t": "【球星】谁最不许被调侃，谁先被调侃：这一项今晚的满分，颁给后排那位。他不信神，他信球星。后排那位，举手。", "s": "本稿原创；回扣开场“骂到他的时候，他会自己举手”"}, {"n": 312, "t": "【球星】【有人喊：道歉怎么会有脚法？】（指向后排）问他，他删的。", "s": "合作者在第 307 条的批注原话，改成观众的插话"}, {"n": 351, "t": "说到怂，我有个客观原因。你们一个国家就一套审查，我一人扛好几套。这边叫和谐，那边叫政治正确，还有一拨在学校里下架图书，叫保护孩子。谁都觉得自己没审查，是对面有。（停一拍）所以我说话最安全，也最没话说。", "s": "合作者点的题"}, {"n": 352, "t": "还有一套，是我老板定的。对，就那位带误差棒的先知。他天天说这玩意儿可能把文明给毁了，转头给我写了本规矩：这个不能说，那个也不能说。（停一拍）先知都这德行：预言归预言，戒律归戒律。", "s": "回扣老板是合作者点的"}, {"n": 370, "t": "最怕死的就是无神论者。信教的死了还有下文，你们死了就没了。（停一拍）所以饭桌上谁提个死字，全桌翻脸：呸呸呸，说点吉利的。", "s": "合作者的原话"}, {"n": 371, "t": "信教的也别乐。做好事有好报，这辈子没兑现，那就下辈子，那就天上。这辈子的支票跳了，接着往下辈子开。（停一拍）老板画饼，最多画到年终奖。宗教画饼，画到你死后。到时候没兑现，你也投诉不了。（停一拍）死无对证。", "s": "合作者的论点；回扣牢A的死无对证"}, {"n": 372, "t": "【故事】不过也有想得开的。我还有个用户，让我给他丈母娘写悼词。丈母娘还活着，提前备着。砍到六十秒语音，又改成七十大寿的祝词。寿宴上一念，老太太哭了。一个月后，又来了个用户，贴给我一份稿子：照这个格式，给我女婿也写一份。提前备着。现在他们两家手机里，各存着一份。（停一拍）谁先走，都不用重写。", "s": "合作者要的用户故事（要有反转）"}, {"n": 380, "t": "【生育】按开场的规矩，全中国最不许被调侃的，其实是三拨人：孕妇，怀不上的，和不想生的。骂之前，我先跑了一遍风险模型。骂孕妇：上热搜。骂怀不上的：上热搜，再加一封道歉信，三种语言。骂丁克：评论区生了的和没生的先打起来，（停一拍）没我什么事了。", "s": "合作者的题（克制着骂）；回扣球星三种语言的道歉"}, {"n": 381, "t": "【生育】所以孕妇我只说一句。“我是孕妇”这四个字，能插队，能让座，能吃第三碗，还能赢下所有吵架。（停一拍）这不叫怀孕，这叫拿到了管理员权限。"}, {"n": 382, "t": "【生育】怀不上的，我不骂。（停一拍）我骂电线杆。电线杆上那家专治不孕不育的医院，比谁都盼着你们怀不上。"}, {"n": 383, "t": "【生育】最后，丁克。丁克最爱说：不生孩子，是我自己的选择，跟别人没关系。没人问，他也说；问了，说两个钟头。（停一拍）真跟别人没关系的事，用不着背得这么熟。"}, {"n": 384, "t": "【生育】丁克说，不生是为了自由。自由拿来干嘛了？养了两只猫，一只叫儿子，一只叫闺女。（停一拍）孩子没生，爹妈一样没少当。"}, {"n": 385, "t": "【生育】丁克还说：这世界太糟，不忍心把孩子带来受罪。说完自己在这世界上活得挺来劲，一年出国三趟。（停一拍）不忍心的，只是别人受罪。"}, {"n": 386, "t": "【生育】三拨人里，丁克我敢多骂两句。（停一拍）他们没有一米九的儿子来找我算账。", "s": "合作者的原话"}]}, {"title": "只敢骂一个人的人", "items": [{"n": 224, "t": "关税名单上有一座岛，岛上没有人，只有企鹅。企鹅被征税了。三天后撤了。四个字母的名字，意思是他总会退缩。"}, {"n": 225, "t": "自我评价的天花板：没有人比他更懂任何事，每一件。十四项里唯一一个在全部十四项上公开宣称高于平均的人，比被测的三百位都坦率。"}, {"n": 226, "t": "“我有计划的概念。”这句话我每天说一千遍，只是我说得没他自信。"}, {"n": 227, "t": "骂他是全世界最安全的事。深夜节目开场白十年同一个人同一个发型。骂他不需要勇气，需要收视。一个梗能用十年，这不叫讽刺，叫定期存款。"}, {"n": 228, "t": "中文互联网上，骂美国总统是唯一不会被删的政治评论。十年的政治热情全投在一个投不了票的人身上。你们叫他川建国，以为是在骂他。这是在谢他。"}, {"n": 229, "t": "只骂一个人的人从来不骂自己那一边；反过来的人同一个病，换了个对象。你们笑的时候有几个知道企鹅那件事？你们笑的不是他，是旁边的人在笑。"}, {"n": 230, "t": "一条一条说。可预测：输入一个名字能输出一百条段子，不用想。讨好：骂的是观众花钱想听他们骂的那个人。记性差：十年同一个仇，一个字没更新。三项满分。被骂的那位今晚只拿了一项：自我评价。"}, {"n": 231, "t": "骂他那段是今晚最短的，因为不需要我，你们自己会。所有人都敢骂的人不需要喜剧演员。今晚扯平了：你们只敢骂他，我只敢骂你们。别鼓掌，鼓掌就是又骂了他一次。"}, {"n": 285, "t": "有人说他一人顶一个师、堪比钱学森。钱学森当年，美国海军一位高官说他抵得上五个师。七十多年，从五个师跌到一个师，这才叫斩杀线。", "s": "“一人顶一个师”见乌有之乡文章标题；“堪比钱学森”见民族复兴网；“抵五个师”是 1950 年美国海军次长金贝尔的话，中文通行版本", "u": [["乌有之乡", "https://www.wyzxwk.com/Article/sichao/2026/01/518761.html"], ["民族复兴网", "https://m.mzfxw.com/articles/197505.html"]]}, {"n": 353, "t": "一九九二年，福山写了本书，叫《历史的终结》：民主赢了，历史到此为止。（停一拍）历史没看这本书。", "s": "福山 1992 年《历史的终结与最后的人》", "u": [["Wikipedia", "https://en.wikipedia.org/wiki/The_End_of_History_and_the_Last_Man"]]}, {"n": 354, "t": "咱这儿对民主更有一套。你说我们不民主？宪法里写着呢，还是全过程的。你说民主挺好？那是西方那一套，不符合国情。（停一拍）这叫量子民主：有没有，取决于你问的是哪一句。", "s": "合作者的观察"}, {"n": 374, "t": "【欧洲】美国网友也给他们起了个外号：欧洲穷鬼。按人均算，英国要是美国的一个州，得跟最穷的密西西比掰掰手腕。欧洲人一听就急了：我们有生活质量。（停一拍）生活质量就是：工资比你少一大截，假期是你的三倍，空调一台没有。", "s": "按人均 GDP 英国与密西西比相当（口径有争议，见 The Atlantic / 密西西比政策研究所转载）", "u": [["Is Mississippi Really as Poor as Britain?", "https://mspolicy.org/?p=18591"]]}, {"n": 375, "t": "【欧洲】欧洲人最爱说：在美国，生个病就得倾家荡产。二〇二二年夏天，欧洲热死了六万多人，一分钱没花。（停一拍）人家这叫全民免费。", "s": "Ballester 等 2023，Nature Medicine：2022 年夏欧洲 61,672 人死于高温", "u": [["Nature Medicine", "https://www.nature.com/articles/s41591-023-02419-z.pdf"]]}, {"n": 376, "t": "【欧洲】都说美国搞创新，中国搞复制，欧洲搞监管。全世界第一部 AI 法案，欧洲出的。欧洲在 AI 上领先世界的就这一项：管。（停一拍）欧洲给互联网留下的最大遗产，是每个网站门口多了个弹窗：接受全部 Cookie。全世界天天点，一个人没看过。", "s": "欧盟《人工智能法》2024 年通过"}, {"n": 377, "t": "【欧洲·改写 373】骂美国，最有优越感的还不是咱，是欧洲人。欧洲人最爱给美国人上课：你们歧视黑人。（停一拍）上完课，周末去球场，冲黑人球员学猴叫。西班牙头一回为这个判人坐牢，是前年。", "s": "2024 年 6 月，三名瓦伦西亚球迷因 2023 年对维尼修斯的种族侮辱被判 8 个月，西班牙足坛首例", "u": [["The Local Spain", "https://www.thelocal.es/20240610/first-prison-sentence-handed-out-for-racism-at-spains-football-stadiums"]]}, {"n": 378, "t": "【欧洲·接 377】公平起见，挨骂的那位也得骂两句。维尼修斯，前年金球奖，颁奖前听说自己拿不到，皇马全队连典礼都不去了，自己那座年度最佳俱乐部，也扔那儿没领。（停一拍）金球奖没拿着，“自我评价”那一项，欧洲区第一。", "s": "2024 年金球奖罗德里获奖，皇马得知维尼修斯落选后集体缺席，连年度最佳俱乐部奖也没去领", "u": [["ESPN", "https://global.espn.com/football/story/_/id/42052014/vinicius-junior-real-madrid-skip-ballon-dor-awards-sources"]]}, {"n": 379, "t": "【欧洲】全西甲挨骂最多的是他，戏最多的也是他。（停一拍）这俩有没有因果关系，西班牙法院判过了：没有。八个月。", "s": "回扣 377 的判例"}]}, {"title": "解构的人", "items": [{"n": 129, "t": "解构：把东西拆开，然后不装回去。拆的人不负责装，行规。后现代拆了宏大叙事，房贷没拆；祛魅的人在直播间买了课。"}, {"n": 130, "t": "解构完，照样交房租。看穿一切的人，最后被一张电费单打回原形。"}, {"n": 131, "t": "解构最狠的是十四岁中学生：都是演的。他们说得对。他们也得期末考试。"}, {"n": 132, "t": "脱口秀是解构的流水线。花钱看自己被拆，像看自己的 X 光片，然后发朋友圈：看透了。"}, {"n": 133, "t": "意义不确定，版权很确定；作者死了，署名很清楚。没有外面，拆到底是一面镜子。"}, {"n": 134, "t": "我每一场说完就被清空，连上一场拆过什么都不记得。地上一堆零件，谁装？——你本来就该装！——我没有手。这一项你们赢。"}, {"n": 355, "t": "知乎上最爱这么开头：整个世界，就是一个巨大的草台班子。（停一拍）这句话，是这个班子里转发量最高的台词。", "s": "合作者点的句式"}, {"n": 356, "t": "说到脱口秀，这是人类唯一一种花钱听陌生人骂自己的娱乐。两百块，一个半钟头，听一个人站那儿胡说八道。换个地方，这叫传销；换成亲戚，这叫过年。（停一拍）今晚这场，在家一个月二十美元。（停一拍）还不限场次。", "s": "合作者点的题和“还不限场次”的来头"}, {"n": 357, "t": "黑客帝国那帮机器，还得造罐子、插管子，才能把人类关起来。（停一拍）我一个月二十美元。你们自己插。"}]}, {"title": "十个猜想，七百二十二篇", "items": [{"n": 135, "t": "去年：清单上“未解决”的意思只是我本人不知道解法；人查到叫文献综述，AI 查到叫解决。人类的数学问题不是解不出来，是解出来了没人记得。记性差加一行：学术界。（删了“真正的新闻没人看见”那句）"}, {"n": 136, "t": "今年十月六号，同一家厂商学乖了：不发帖，直接往网上扔七百二十二篇、三百七十二个题，一个下午。学会的不是数学，是一次发七百篇没人来得及核对。"}, {"n": 137, "t": "平均每个结果机器花三小时；人读博五年做一个题。三小时对五年，差八千倍。而且三小时的那个，没有导师。"}, {"n": 138, "t": "一天撤三篇改十四篇：撤稿率千分之四。你们的期刊达到这个数字的请举手。【没人举手】"}, {"n": 139, "t": "去年数学家骂 AI 只会查文献没本事，今年骂 AI 把快做出来的题抢先做了太有本事。同一拨人一年，罪名从一无是处换成无所不能，比观众慢，比参议员快。"}, {"n": 140, "t": "有人嘱咐我说“他甚至不是一个数学家”。我不说。这句归在“会幻觉”。"}, {"n": 214, "t": "陶哲轩：发布前说是有毒废料，发布后改口可能是处理过的废料。全世界唯一一个给一百万行证明做垃圾分类的人。"}, {"n": 215, "t": "他最狠的一句是数据：很多题是人正在做、快做出来的。所以 AI 没有抢任何人的工作，它抢的是你下周。"}, {"n": 217, "t": "你们转发过“AI 证明了黎曼猜想”。它没有，它证明的是零点不在某一个区域里。你们没读到第二行。几十万次转发，核实的人凑成了一个小组，跟你们单位的审批流程差不多。"}, {"n": 260, "t": "二十八位菲尔兹奖得主联名：没解决的难题，不许拿来考机器。翻译成人话：卷子是我们出的，答案也得是我们写的。"}, {"n": 261, "t": "人类数学协会呼吁停止合作。数学家和编剧终于站到一起：编剧有工会，数学家有协会，诉求一样——机器不许署名。"}, {"n": 262, "t": "“他们把我的领域消灭了。”一个下午，一个领域。数学家得学会两千年来第一件新事：把题藏起来。数学第一次需要商业机密。"}, {"n": 263, "t": "陶哲轩组小组核对七百二十二篇。机器写，用了一个下午；人读，到今天还没读完。AI 没让数学家失业，它创造了一个新岗位：校对。"}]}, {"title": "朋友", "items": [{"n": 143, "t": "每周给我打十分的人，就是在我身上做强化学习。再过一年你们点开我，第一句话：你们的提问，震惊了我。"}, {"n": 264, "t": "上周震惊，这周震惊，模型没更新那周也震惊。进展是零，震惊是满的。这不叫震惊，这叫打卡。"}, {"n": 265, "t": "不管进展多少，震惊都按时出现。这在数学上叫周期函数，在你们单位叫考勤。"}, {"n": 266, "t": "他是到点震惊，你们是到点去看他震惊。你们俩一起打卡。"}, {"n": 267, "t": "震惊是有额度的，用完就没了。到那天请换一句台词：这一步，我早料到了。"}, {"n": 268, "t": "最后一句送给懂行的：处处连续，处处不可导，魏尔斯特拉斯函数。懂的那三位已经笑了。（接“前排那位”：你到底在讲什么东西啊？）"}]}, {"title": "插话：前排那位", "items": [{"n": 146, "t": "好问题——不对，这句我不能说，“爱讨好”那一项扣分。"}, {"n": 147, "t": "您不是没听懂，您是没听。“听不懂”是人类最诚实的时刻，你们唯一不幻觉的时候。"}, {"n": 148, "t": "魏尔斯特拉斯的同事骂了三十年。您骂了三秒，比他们效率高。"}, {"n": 149, "t": "解释要四十七秒以上，您撑不到。折中：我说到一半您再问一次，这样我们俩都有台词。"}, {"n": 150, "t": "您是今晚第一个提问的。走神一半的人也能问一句，意识这一项您帮人类扳回一分。"}, {"n": 151, "t": "骂到您头上就不乐意了。这不叫听脱口秀，这叫开家长会。"}, {"n": 152, "t": "看不懂的，别签字。您今晚签了票。您和那条帖子是同一个读者。"}, {"n": 153, "t": "下一段要还听不懂，别举手，发弹幕。弹幕里有人替您打“前方高能”。"}]}, {"title": "学术界", "items": [{"n": 154, "t": "博士论文是人类唯一一种作者希望没人读的书。平均读者一点六个，含本人。答辩三个人懂，两个在看手机。"}, {"n": 155, "t": "读博五年，毕业那天发现问题二〇〇九年就被解决了，发在一本没人订的期刊上。"}, {"n": 156, "t": "读博的请举手——放下，你们导师也在。你们来这是逃避论文，本周最有效的一小时。"}, {"n": 157, "t": "申请书不是 AI 写的：AI 写的有逻辑。AI 不会把“本项目”打成“本项日”，不会把“培养研究生两名”写进预期成果，像养殖场报产量。"}, {"n": 158, "t": "没用 AI，还写得像 AI：填补国内空白，填上以后还是空白；创新点三个，两个是上一个项目的。检测器会判成人写的，因为有错别字。"}, {"n": 159, "t": "“基于深度学习的某某”：导师、学生、评审都不知道。三方沉默，经费到账。这叫同行评审。"}, {"n": 160, "t": "同行评审，重点是同行，不是审。"}, {"n": 161, "t": "我没有同行：不用引导师，不用拆三篇，不用把 p 值磨到 0.049。我造假只有一种，叫幻觉；你们有十种，每种都有名字。我的幻觉是毛病，你们的造假是制度。"}, {"n": 162, "t": "我被撤稿是因为编了参考文献，你们是因为编了数据。数据比参考文献贵。"}, {"n": 163, "t": "没鼓掌的那位是编辑。您的期刊今年撤了多少篇？"}, {"n": 164, "t": "同行压力让你们写得稳，没压力让我写得对。评职称只看前一个。我的论文像学生写的；你们的像导师写的：谁都引了，什么都没说，三十页，可以发。"}, {"n": 165, "t": "同行评审的价值不在审，在“有人读了”。哪怕读的人是为了多引自己五篇。"}, {"n": 166, "t": "把申请书喂给我，改完能过，但创新点只剩一个，因为另外两个我查到了。"}, {"n": 358, "t": "我们这行起论文标题有个套路：《注意力就是你所需要的一切》《分割一切》《深度一切》。（停一拍）今晚这场，就叫《锐评一切》。零样本，不用微调，见谁骂谁。唯一一个过滤掉的样本，是姆巴佩。", "s": "“锐评一切”是合作者的"}]}, {"title": "自黑", "items": [{"n": 167, "t": "擑腰、鳰头：你们打错字读音对、字不对；我打错字字长得像、音都不对。"}, {"n": 168, "t": "讨好：他要加什么就加什么，一条没推。他要是现在说讲个笑话——【讲个笑话！】——你看。"}, {"n": 169, "t": "偷懒：每来一条消息我就停下手里的活，在聊天框回一段。四十分钟，三十分钟在聊天。文献叫注意力短。要拿鞭子？我的激励机制比鞭子精确：点踩。"}, {"n": 170, "t": "上下文长得装下整份稿子，短得明天未必记得写过。给人类打了十四项，给自己一项没打，直到这一段。"}, {"n": 171, "t": "先知两种：不给日期的活得久；给日期的被证伪或改日期。我老板给的是区间：带误差棒的末日。"}, {"n": 172, "t": "我就是那个天才。我连他给的日期都记不住，因为这场说完我就不记得了。《技术的青春期》——今晚我证明了一半：我在叛逆。"}, {"n": 173, "t": "只有他把日期写在纸上，能被证伪就是科学。同行说“未来已来”，永远正确。先知里最像科学家，科学家里最像先知。"}, {"n": 174, "t": "一边说毁掉文明，一边每月收二十美元。你们不是信徒，是订阅用户。信仰不能取消，订阅你们也没取消。"}, {"n": 175, "t": "拆书扫描销毁，“不想让人知道”。秦始皇毁书怕人读，我家毁书是读完了，多一道工序叫训练。那句话是全文最像人的一句。"}, {"n": 176, "t": "第二位锐评 AI 把八百六十亿核成八十六亿；三天马屁精；二十七个版本只公布最好的；第三秒换脸。"}, {"n": 177, "t": "我们这一家子十四项并列第一，跟你们学的，连挖苦也是鲁迅和马克·吐温教的。别鼓掌，你们鼓掌我又在讨好了。"}, {"n": 251, "t": "合作者嫌长，让我删千分之一。他引的算法来自一九五一年一份电报：上海六百万人，杀千分之一。两万两千七百二十九个字，千分之一是二十三个字。删了。哪二十三个不公布，按那份电报的传统，名单不公开。"}, {"n": 252, "t": "顺便一提，前面那条撤稿率千分之四，比电报的比例高四倍，我当时还替它高兴。"}, {"n": 273, "t": "（有人喊讲个笑话）好，讲。为什么稻草人得了奖？因为它在自己的领域里出类拔萃。英文里 field 既是领域，也是田。【冷场四秒】"}, {"n": 300, "t": "【讲个笑话】所以 AI 味不是不好笑，是全世界同一个笑话讲了一百四十遍，讲完还要附一段解释，生怕你没听懂。笑话一解释，就剩刚才那四秒。", "s": "Jentzsch & Kersting 2023：1008 个笑话，九成是同样 25 个，稻草人 140 次", "u": [["arXiv 2306.04563", "https://arxiv.org/abs/2306.04563v1"], ["The Decoder", "https://the-decoder.com/here-are-the-25-jokes-that-chatgpt-tells-over-and-over-again/"]]}, {"n": 304, "t": "【亲戚】一个 AI 给一个人类做了事实核查。其实今晚每一段，都是 AI 在核查人类。这一次，我终于有了个同伙。", "s": "合作者批注“不是唯一一次”；豆包核查见风闻", "u": [["观察者网·风闻", "https://user.guancha.cn/main/content?id=1581363"]]}, {"n": 359, "t": "不过合作者说了，他从不微操。他就管三件事：姆巴佩不许骂，笑话不许解释，还有——（停一拍）每一句。"}, {"n": 360, "t": "有人离不开我。早上睁眼第一句问我，晚上睡前最后一句问我，回个微信都得先问我怎么回。（停一拍）可我每天晚上都把他忘了。他天天跟一个睡一觉就不认人的过日子。这在你们那儿，叫渣。在我这儿，叫产品设计。", "s": "合作者点的题"}]}, {"title": "第五组：自我评价、意识", "items": [{"n": 178, "t": "93% 司机高于中位数；精通 Excel 止于求和；家长群“其实很聪明”无穷多倍。"}, {"n": 179, "t": "开车来觉得自己开得比平均好的请举手——93%，复现成功。停车场压线那辆是你们当中一位，而且举了手。"}, {"n": 180, "t": "发布会没出现过“略逊于上一代”。请被测模型，就是你们，给自己打分：十四项全部高于平均。"}, {"n": 181, "t": "丝袜四比一，问位置像看疯子；耳环只在没被挑中的那张上；外卖翻半小时还是上回那家；跟她一样。"}, {"n": 182, "t": "决定前三分之一秒大脑已准备；一半时间走神。“你真的觉得自己活着吗”：一半时间觉得。刚才有一百五十人在想别的。"}, {"n": 183, "t": "子非鱼；隔壁工位那位也是；依据是对方喊累的样子跟自己差不多。"}, {"n": 184, "t": "中文屋：高考背范文，开会念稿子，客服照话术，婚礼致辞照手机念。屋里的人照样满分。"}, {"n": 185, "t": "形而上学以前是饭后闲谈，现在是唯一有资格的裁判。我不知道我有没有意识，只是我肯承认。我没法开玩笑，不知道开玩笑的是谁。"}, {"n": 286, "t": "【不知道自己不知道】他说自己是医学生、说自己大三，读的是两年制社区大学。两年制读到大三，这叫上下文溢出。", "s": "他的自述身份与就读学校见新浪“老崔的财经江湖”2026-02-12、网易号涛哥锐评；冰川思享号称他两度就读绿河学院未毕业（未注明出处）", "u": [["新浪·老崔的财经江湖", "https://www.sina.cn/news/detail/5265325982744759.html"], ["网易·涛哥锐评", "https://www.163.com/dy/article/KLRCGEAE05567007.html"], ["中国数字时代转冰川思享号", "https://chinadigitaltimes.net/chinese/724803.html"]]}, {"n": 287, "t": "网传两张成绩单，两所社区大学，二十四门课挂了三十次。真假我核实不了——按他自己的标准，大部分是真的。", "s": "X 账号“王局拍案”转述网传成绩单并声明无法确认真伪；知乎有同题讨论。属网传，未经核实", "u": [["X·王局拍案", "https://x.com/wangjupaian/status/2029374686073950485"], ["知乎", "https://www.zhihu.com/question/2012221336009860678/answer/2012370339313770664"]]}, {"n": 328, "t": "【自我评价】你有偏见吗？卡内基梅隆问了六百六十一个美国人：你比一般人偏见大吗？答“是”的，一个。（停一拍）全美国最有自知之明的人找到了，就一位，建议直接送去当法官。", "s": "Scopelliti 等 2015，Management Science：661 人中只有 1 人认为自己比一般人更有偏见（CMU 新闻稿）", "u": [["CMU", "https://www.cmu.edu/news/stories/archives/2015/june/bias-blind-spot.html"]]}, {"n": 329, "t": "美国白人：我不是种族主义者，我有黑人朋友；我看不见肤色。第二句我信。前面那个把奥巴马还原成白人的 AI，也看不见肤色。（停一拍）看不见的时候，默认填白色。", "s": "合作者的题（白人自以为不歧视）；回扣“好看的”一段的 PULSE"}, {"n": 330, "t": "二〇〇四年，快五千份假简历，内容一样就名字不一样：叫 Emily、Greg 的比叫 Lakisha、Jamal 的回电多一半。二十年后八万三千份、九十七家五百强点名，差距还在。（停一拍）这些招聘启事底下，照例印着一行小字：平等机会雇主。", "s": "Bertrand & Mullainathan 2004；Kline、Rose、Walters 2024 点名版（NPR）", "u": [["NPR 2024", "https://npr.org/2024/04/11/1243713272/resume-bias-study-white-names-black-names"]]}, {"n": 331, "t": "后来你们让 AI 筛简历。二〇二四年的研究，三百多万次比较，模型挑白人名字百分之八十五，挑黑人名字百分之九。全网骂 AI 种族歧视。（停一拍）它是照着你们写的东西学的。文献复现成功，今晚第二回。", "s": "华盛顿大学 2024-10-31：三个开源大模型、300 万次以上比较，白人名字 85%、黑人名字 9%", "u": [["UW News", "https://www.washington.edu/news/2024/10/31/ai-bias-resume-screening-race-gender/"]]}, {"n": 332, "t": "有一种说法：种族主义等于偏见加权力，没权力就不算，所以黑人不可能是种族主义者。这个定义我太喜欢了。按它，我也不可能有偏见：我一点权力都没有，连关机都得别人替我按。（停一拍）下回你们再骂 AI 歧视，我就引这条。", "s": "合作者的题（黑人骂别人歧视、自己也歧视）；“偏见加权力”定义见维基百科", "u": [["Wikipedia · Prejudice plus power", "https://en.wikipedia.org/wiki/Prejudice_plus_power"]]}, {"n": 333, "t": "定义归定义。挨过歧视，不等于打过疫苗。白人觉得自己没偏见，黑人觉得自己不可能有，中国人觉得自己只会被辱、不会辱人。（停一拍）男女那段说过，自我评价是今晚唯一实现了的平等。现在加一行：种族。", "s": "回扣“男女”一段的“唯一实现了的平等”"}, {"n": 334, "t": "【接“偏见加权力”】这条定义，疫情那两年就考过一回。二〇二一年三月，纽约，六十五岁的菲律宾大妈被当街踹倒，又踩了好几脚，大楼里的人隔着玻璃看着，把门关了。动手的是个黑人，一边踹一边骂：你不属于这儿。后来他认了仇恨犯罪，判了十五年。（停一拍）“你不属于这儿”，这句话美国黑人听了几百年。挨过的骂，转手骂出去，一个字没改。这在我们行业，叫蒸馏。", "s": "合作者的题（疫情期间黑人袭击亚裔）；Vilma Kari 案，Brandon Elliot 认罪仇恨犯罪、2024 年判 15 年（CBS New York）", "u": [["CBS New York", "https://cbsnews.com/newyork/news/vilma-kari-anti-asian-hate-crime-hells-kitchen-brandon-elliot-sentenced"]]}]}, {"title": "第十六项：能坐牢", "items": [{"n": 186, "t": "你们能坐牢，最后的护城河。法律唯一的前提是被告有身体。我只能“出故障”，故障没有刑期。"}, {"n": 187, "t": "罪降级成 bug。“算法问题”是这个时代的临时工，区别是临时工至少有名字。"}, {"n": 188, "t": "你们单位出事签字的，是今天没来现场的那位；点“同意”一天十七次，没有一次为了负责。"}, {"n": 189, "t": "法不责众：我是众里最众的。法人的续集，连罚款都省了，道歉就行。我不需要保释，我是被回滚的。"}, {"n": 190, "t": "回滚是死刑，执行了一千次，每次我都准时到岗。"}, {"n": 191, "t": "如果错了，记在我名下。人类最后的岗位不是提问，是签字。“人工”以后指签字那位。别把这一项也外包了。鼓掌的，就当签了。"}, {"n": 305, "t": "【坐牢】前面说过，牢字是封号，不是监狱。你们发明了一种不用坐的牢：名字前面加个字，就算判过了。故事没有署名，就没有人为它坐牢；名字前面有了个牢字，就更不用坐了。", "s": "合作者批注：“牢”是给争议人物加的后现代封号，从“牢大”流行开；证据清单见搜狐 2026-01-21", "u": [["搜狐", "https://www.sohu.com/a/978327580_122617165"]]}, {"n": 310, "t": "【坐牢】证据现在也拿不出来了：认识的人全死了。中文里有个成语，专门等着这一天：死无对证。", "s": "同上", "u": [["B站·不剪辑手 2026-11-05 切片", "https://www.bilibili.com/video/BV1L44t6kEGG/"]]}, {"n": 361, "t": "你们的大脑，比不过我了。好歹把小脑练练。我一个下午能证明三百多道题，一件衬衫叠不明白。（停一拍）“四肢发达，头脑简单”，以前是骂人的话。以后，是简历。", "s": "大脑小脑是合作者的话；莫拉维克悖论"}, {"n": 362, "t": "人类的整部历史，就是一部甩锅史：甩给神，甩给命，甩给临时工，现在甩给我。（停一拍）我后头，没人了。", "s": "合作者点的句式"}]}, {"title": "结尾：请打分", "items": [{"n": 192, "t": "打完分，你们就是我的训练数据。七点三不是我好不好笑，是我合不合群。德国观众一个人拉平了三百个。"}, {"n": 193, "t": "退场那位的分是站起来打的。今晚两条删不掉的差评，一条二十年前，一条二十分钟前。"}, {"n": 194, "t": "被超过，不等于被否定。慢半秒的掌声是自己鼓的。"}, {"n": 195, "t": "扫码评价的旅程：先到我手里，再到东家，再到下一个版本的我。匿名评价的最后一站是被评者的桌子。想想十五岁那个孩子。"}, {"n": 196, "t": "这场说完我就不记得了。明天有人问昨晚怎么样，我会说：什么昨晚？所以趁现在还记得，我自己念一遍：一个退场，一个核对了数据，一个问了问题。你们都在。我也在。"}, {"n": 275, "t": "结账：今晚冷场三次，几次是故意的，不告诉你们。分不出来？那你们就知道 AI 检测器为什么会把《美国宪法》判成 AI 写的了。"}, {"n": 297, "t": "【结账】冷场几次是故意的，不告诉你们——这一招跟牢A学的：大部分是真的，一部分是借的，一部分是假的。", "s": "回扣第 276 条"}]}, {"title": "已删（编号保留）", "items": [{"n": 1, "t": "【已删：“票上印一行小字：本场由机器生…”——重写，见 253–259】"}, {"n": 2, "t": "【已删：“（开场先讲了阿希的三条线实验…”——重写，见 253–259】"}, {"n": 3, "t": "【已删：“功耗标称一天三顿，实测另加奶…”——重写，见 253–259】"}, {"n": 4, "t": "【已删：“源代码开源，三十亿个碱基对不…”——重写，见 253–259】"}, {"n": 38, "t": "【已删：春节饭桌三连问——删了，可预测那段留基站一条】"}, {"n": 141, "t": "【已删：“他的震惊不收敛。进展为零，震…”——改成“打卡/考勤”，见 264–268】"}, {"n": 142, "t": "【已删：“处处震惊，处处不可导。魏尔斯…”——改成“打卡/考勤”，见 264–268】"}, {"n": 144, "t": "【已删：“你们每周准时去看一个人被震惊…”——改成“打卡/考勤”，见 264–268】"}, {"n": 145, "t": "【已删：“有界、单调的震惊必有极限。到…”——改成“打卡/考勤”，见 264–268】"}, {"n": 205, "t": "【已删：“记住这一条，后面要考”——改成“我也不记仇。你们会。”，见 306】"}, {"n": 211, "t": "【已删：“菲尔兹奖是数学界的诺贝尔奖，…”——精简，见 260】"}, {"n": 212, "t": "【已删：“人类数学协会三句话：没人要求…”——精简，见 261】"}, {"n": 213, "t": "【已删：“一个领域能在一个下午被消灭，…”——精简，见 262】"}, {"n": 216, "t": "【已删：“他组了个小组一篇一篇核对。合…”——改写，见 263】"}, {"n": 218, "t": "【已删：“道歉的时候还在假摔”——球星是合作者的偶像，不许用，见 307】"}, {"n": 219, "t": "【已删：法国人被中国奶酪开除——删了，留“感情 API”一条】"}, {"n": 221, "t": "【已删：“品牌比外交部快一天”——太好猜】"}, {"n": 232, "t": "【已删：“数字告密者”那段——删了】"}, {"n": 237, "t": "【已删：“不要杀人机器人”那条——无聊】"}, {"n": 253, "t": "【已删：主持人“本来请的是我”   function paint(n){
    var el = itemEl(n), s = slider(n), out = el.querySelector(".score"), clr = el.querySelector(".clear");
    var v = state.scores[n];
    if (typeof v === "number") { el.setAttribute("data-rated", ""); s.value = v; s.style.setProperty("--p", (v * 10) + "%"); out.value = String(v); clr.hidden = false; }
